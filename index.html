<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniTask — Student Task Management</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #ffffff12;
    --border2: #ffffff20;
    --text: #f0eff5;
    --muted: #8884a0;
    --accent: #c4f045;
    --accent2: #7c6fcd;
    --danger: #ff5e5e;
    --warn: #ffba3b;
    --info: #4fc3f7;
    --success: #69f0ae;
    --faculty: #c4f045;
    --student: #b39ddb;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 15px; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* LOGIN */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  #login-screen::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    background: radial-gradient(circle, #c4f04520 0%, transparent 70%);
    top: -100px; left: -100px;
    border-radius: 50%;
    animation: pulse 6s ease-in-out infinite;
  }
  #login-screen::after {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    background: radial-gradient(circle, #7c6fcd25 0%, transparent 70%);
    bottom: -50px; right: -50px;
    border-radius: 50%;
    animation: pulse 8s ease-in-out infinite reverse;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.15);opacity:0.7} }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 20px;
    padding: 48px 40px;
    width: 420px;
    position: relative;
    z-index: 2;
    backdrop-filter: blur(20px);
    animation: fadeUp 0.6s ease;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }

  .login-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 2.2rem;
    color: var(--accent);
    letter-spacing: -1px;
    margin-bottom: 6px;
  }
  .login-sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 36px; font-weight: 400; }

  .role-toggle {
    display: flex;
    background: var(--surface2);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 28px;
    border: 1px solid var(--border);
  }
  .role-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 7px;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.25s;
    background: transparent;
    color: var(--muted);
  }
  .role-btn.active {
    background: var(--accent);
    color: #0a0a0f;
  }

  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .form-group input {
    width: 100%;
    padding: 13px 16px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus { border-color: var(--accent); }

  .login-btn {
    width: 100%;
    padding: 15px;
    background: var(--accent);
    color: #0a0a0f;
    border: none;
    border-radius: 10px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
    letter-spacing: 0.5px;
  }
  .login-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 30px #c4f04540; }

  .demo-hint { text-align: center; margin-top: 20px; font-size: 0.78rem; color: var(--muted); }
  .demo-hint span { color: var(--accent); cursor: pointer; }

  /* APP SHELL */
  #app { display: none; min-height: 100vh; }
  .layout { display: flex; min-height: 100vh; }

  /* SIDEBAR */
  .sidebar {
    width: 240px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 28px 0;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 100;
    transition: transform 0.3s;
  }
  .sidebar-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 1.6rem;
    color: var(--accent);
    padding: 0 24px 28px;
    border-bottom: 1px solid var(--border);
    letter-spacing: -0.5px;
  }
  .sidebar-logo span { color: var(--muted); font-size: 0.7rem; font-family: 'Syne', sans-serif; font-weight: 600; display: block; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }

  .nav-section { padding: 20px 14px 8px; }
  .nav-label { font-size: 0.65rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; padding: 0 10px; margin-bottom: 8px; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 10px;
    border-radius: 9px;
    cursor: pointer;
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 600;
    transition: all 0.2s;
    margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--accent); color: #0a0a0f; }
  .nav-item .icon { font-size: 1.1rem; width: 22px; text-align: center; }
  .nav-badge { margin-left: auto; background: var(--danger); color: white; border-radius: 50px; font-size: 0.65rem; padding: 2px 7px; font-family: 'DM Mono', monospace; }

  .sidebar-user {
    margin-top: auto;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .user-avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.85rem; flex-shrink: 0;
  }
  .user-info .name { font-size: 0.85rem; font-weight: 600; }
  .user-info .role-tag { font-size: 0.68rem; color: var(--muted); font-weight: 500; }
  .logout-btn { margin-left: auto; cursor: pointer; color: var(--muted); font-size: 1rem; transition: color 0.2s; }
  .logout-btn:hover { color: var(--danger); }

  /* MAIN CONTENT */
  .main { margin-left: 240px; padding: 36px 40px; flex: 1; }
  .page { display: none; animation: fadeUp 0.4s ease; }
  .page.active { display: block; }

  .page-header { margin-bottom: 32px; }
  .page-title { font-family: 'DM Serif Display', serif; font-size: 2rem; font-weight: 400; letter-spacing: -0.5px; }
  .page-title span { font-style: italic; color: var(--accent); }
  .page-sub { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }

  /* STAT CARDS */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 32px; }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s;
  }
  .stat-card:hover { transform: translateY(-2px); }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .stat-card.green::before { background: var(--accent); }
  .stat-card.purple::before { background: var(--accent2); }
  .stat-card.red::before { background: var(--danger); }
  .stat-card.blue::before { background: var(--info); }
  .stat-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 12px; }
  .stat-value { font-family: 'DM Mono', monospace; font-size: 2.2rem; font-weight: 500; line-height: 1; }
  .stat-value.green { color: var(--accent); }
  .stat-value.purple { color: var(--accent2); }
  .stat-value.red { color: var(--danger); }
  .stat-value.blue { color: var(--info); }
  .stat-delta { font-size: 0.75rem; color: var(--muted); margin-top: 8px; }
  .stat-delta.up { color: var(--success); }

  /* GRID LAYOUT */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .wide-col { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }

  /* PANEL */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
  }
  .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .panel-title { font-size: 0.9rem; font-weight: 700; }
  .panel-action { font-size: 0.78rem; color: var(--accent); cursor: pointer; font-weight: 600; background: none; border: none; font-family: 'Syne', sans-serif; }

  /* TASK ITEMS */
  .task-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .task-item:last-child { border-bottom: none; padding-bottom: 0; }
  .task-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .task-info { flex: 1; }
  .task-name { font-size: 0.88rem; font-weight: 600; margin-bottom: 3px; }
  .task-meta { font-size: 0.75rem; color: var(--muted); }
  .task-badge {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    padding: 3px 10px;
    border-radius: 50px;
    font-weight: 500;
  }
  .badge-pending { background: #ffba3b20; color: var(--warn); }
  .badge-progress { background: #4fc3f720; color: var(--info); }
  .badge-done { background: #69f0ae20; color: var(--success); }
  .badge-graded { background: #c4f04520; color: var(--accent); }
  .badge-overdue { background: #ff5e5e20; color: var(--danger); }

  /* STUDENTS TABLE */
  .table { width: 100%; border-collapse: collapse; }
  .table th { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); padding: 0 0 12px; text-align: left; border-bottom: 1px solid var(--border); }
  .table td { padding: 14px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; vertical-align: middle; }
  .table tr:last-child td { border-bottom: none; }

  .score-bar { display: flex; align-items: center; gap: 10px; }
  .bar-bg { flex: 1; height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
  .score-num { font-family: 'DM Mono', monospace; font-size: 0.8rem; width: 35px; text-align: right; }

  .avatar-sm {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 700; margin-right: 8px;
  }
  .student-name-cell { display: flex; align-items: center; }

  /* CHART */
  .mini-chart { display: flex; align-items: flex-end; gap: 5px; height: 70px; }
  .bar-item { flex: 1; border-radius: 4px 4px 0 0; min-width: 0; transition: height 0.5s ease; cursor: pointer; }
  .bar-item:hover { opacity: 0.8; }
  .chart-labels { display: flex; gap: 5px; margin-top: 6px; }
  .chart-labels span { flex: 1; text-align: center; font-size: 0.6rem; color: var(--muted); font-family: 'DM Mono', monospace; }

  /* CREATE TASK FORM */
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .f-group { margin-bottom: 16px; }
  .f-group label { display: block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 7px; }
  .f-group input, .f-group select, .f-group textarea {
    width: 100%;
    padding: 11px 14px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 9px;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .f-group input:focus, .f-group select:focus, .f-group textarea:focus { border-color: var(--accent); }
  .f-group select option { background: var(--surface2); }
  .f-group textarea { resize: vertical; min-height: 80px; }

  .btn {
    padding: 11px 22px;
    border-radius: 9px;
    border: none;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }
  .btn-primary { background: var(--accent); color: #0a0a0f; }
  .btn-primary:hover { box-shadow: 0 4px 20px #c4f04540; transform: translateY(-1px); }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border2); }
  .btn-danger { background: #ff5e5e20; color: var(--danger); border: 1px solid #ff5e5e30; }

  /* EVALUATION PANEL */
  .eval-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 16px;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }
  .eval-item:hover { border-color: var(--border2); }
  .eval-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .eval-task { font-weight: 600; font-size: 0.88rem; }
  .eval-student { font-size: 0.78rem; color: var(--muted); }
  .grade-input-row { display: flex; align-items: center; gap: 10px; }
  .grade-input {
    width: 70px;
    padding: 7px 10px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 7px;
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    text-align: center;
    outline: none;
  }
  .grade-input:focus { border-color: var(--accent); }
  .grade-slash { color: var(--muted); font-family: 'DM Mono', monospace; }

  /* STUDENT TODO */
  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .todo-item:last-child { border-bottom: none; }
  .todo-check {
    width: 20px; height: 20px;
    border: 2px solid var(--border2);
    border-radius: 5px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .todo-check.checked { background: var(--accent); border-color: var(--accent); color: #0a0a0f; font-size: 0.75rem; }
  .todo-text { flex: 1; font-size: 0.85rem; }
  .todo-text.done { text-decoration: line-through; color: var(--muted); }

  /* PERFORMANCE SCORE RING */
  .score-ring-wrap { display: flex; align-items: center; gap: 20px; }
  .ring-svg { flex-shrink: 0; }
  .score-stats { }
  .score-big { font-family: 'DM Mono', monospace; font-size: 2.8rem; color: var(--accent); line-height: 1; }
  .score-label { font-size: 0.75rem; color: var(--muted); margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .score-breakdown { margin-top: 14px; }
  .score-row { display: flex; justify-content: space-between; font-size: 0.78rem; margin-bottom: 8px; }
  .score-row span:first-child { color: var(--muted); }
  .score-row span:last-child { font-family: 'DM Mono', monospace; color: var(--text); }

  /* TABS */
  .tabs { display: flex; gap: 4px; margin-bottom: 22px; background: var(--surface2); padding: 4px; border-radius: 10px; width: fit-content; }
  .tab { padding: 8px 18px; border-radius: 7px; cursor: pointer; font-size: 0.83rem; font-weight: 600; color: var(--muted); transition: all 0.2s; border: none; background: transparent; font-family: 'Syne', sans-serif; }
  .tab.active { background: var(--surface); color: var(--text); }

  /* NOTIFICATION DOT */
  .notif-dot { width: 8px; height: 8px; background: var(--danger); border-radius: 50%; display: inline-block; margin-left: 6px; }

  /* DEADLINE WIDGET */
  .deadline-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .deadline-item:last-child { border-bottom: none; }
  .deadline-date { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--muted); min-width: 60px; }
  .deadline-bar { flex: 1; height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .deadline-fill { height: 100%; border-radius: 2px; }
  .deadline-days { font-family: 'DM Mono', monospace; font-size: 0.72rem; min-width: 45px; text-align: right; }

  /* ACTIVITY FEED */
  .activity-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .activity-item:last-child { border-bottom: none; }
  .activity-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
  .activity-text { font-size: 0.82rem; color: var(--muted); line-height: 1.5; }
  .activity-text strong { color: var(--text); font-weight: 600; }
  .activity-time { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); margin-top: 2px; }

  /* TOGGLE SWITCH */
  .toggle-wrap { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: var(--muted); }
  .toggle { position: relative; width: 38px; height: 20px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; inset: 0; background: var(--surface2); border-radius: 20px; cursor: pointer; border: 1px solid var(--border2); transition: 0.2s; }
  .toggle-slider::before { content: ''; position: absolute; height: 14px; width: 14px; left: 2px; bottom: 2px; background: var(--muted); border-radius: 50%; transition: 0.2s; }
  .toggle input:checked + .toggle-slider { background: #c4f04530; border-color: var(--accent); }
  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: #0008; backdrop-filter: blur(4px); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; padding: 32px; width: 480px; animation: fadeUp 0.3s ease; }
  .modal-title { font-family: 'DM Serif Display', serif; font-size: 1.4rem; margin-bottom: 20px; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

  /* RESPONSIVE TWEAKS */
  @media(max-width: 900px) {
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .two-col, .wide-col { grid-template-columns: 1fr; }
    .three-col { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">UniTask</div>
    <div class="login-sub">University Task Management System</div>
    <div class="role-toggle">
      <button class="role-btn active" onclick="setRole('faculty')">👩‍🏫 Faculty</button>
      <button class="role-btn" onclick="setRole('student')">🎓 Student</button>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="text" id="login-email" value="prof.sarah@university.edu" placeholder="your@university.edu">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-pass" value="••••••••" placeholder="••••••••">
    </div>
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <div class="demo-hint">Don't have an account? <span onclick="showRegister()">Sign Up</span></div>
  </div>
</div>

<!-- REGISTER -->
<div id="register-screen" style="display: none;">
  <div class="login-card">
    <div class="login-logo">UniTask</div>
    <div class="login-sub">Create your account</div>
    <div class="role-toggle">
      <button class="role-btn reg-role-btn active" onclick="setRegRole('faculty')">👩‍🏫 Faculty</button>
      <button class="role-btn reg-role-btn" onclick="setRegRole('student')">🎓 Student</button>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="reg-email" placeholder="your@university.edu" oninput="validateReg()">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="reg-pass" placeholder="Min 8 chars, 1 uppercase, 1 number" oninput="validateReg()">
    </div>
    <div id="reg-error" style="color: var(--danger); font-size: 0.75rem; margin-bottom: 10px; display: none;"></div>
    <button class="login-btn" id="reg-btn" onclick="doRegister()" disabled style="opacity: 0.5; cursor: not-allowed;">Sign Up</button>
    <div class="demo-hint">Already have an account? <span onclick="showLogin()">Sign In</span></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="layout">
    <!-- SIDEBAR -->
    <nav class="sidebar">
      <div class="sidebar-logo">
        <span>UniTask</span>
        <span id="sidebar-role-badge" style="font-size:0.7rem;font-family:'DM Mono',monospace;color:var(--accent);">●  FACULTY</span>
      </div>
      <div id="sidebar-nav"></div>
      <div class="sidebar-user">
        <div class="user-avatar" id="sidebar-avatar" style="background:#c4f04520;color:var(--accent)">PB</div>
        <div class="user-info">

function setRegRole(r) {
  regRole = r;

  validateReg();
}

function showRegister() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('register-screen').style.display = 'flex';
}

function showLogin() {
  document.getElementById('register-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function validateReg() {
  const email = document.getElementById('reg-email').value;
  const pass = document.getElementById('reg-pass').value;
  const err = document.getElementById('reg-error');
  const btn = document.getElementById('reg-btn');
  
  let errorMsg = '';
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  
  if (!email || !pass) {
    errorMsg = '';
  } else if (!emailRegex.test(email)) {
    errorMsg = 'Please enter a valid email address.';
  } else if (pass.length < 8) {
    errorMsg = 'Password must be at least 8 characters.';
  } else if (!/[A-Z]/.test(pass)) {
    errorMsg = 'Password must contain at least one uppercase letter.';
  } else if (!/[0-9]/.test(pass)) {
    errorMsg = 'Password must contain at least one number.';
  }

  if (email && pass && errorMsg) {
    err.textContent = errorMsg;
    err.style.display = 'block';
  } else {
    err.style.display = 'none';
  }

  if (email && pass && !errorMsg) {
    btn.disabled = false;
    btn.style.opacity = '1';
    btn.style.cursor = 'pointer';
  } else {
    btn.disabled = true;
    btn.style.opacity = '0.5';
    btn.style.cursor = 'not-allowed';
  }
}

function doRegister() {
  alert('Registration successful! Please login.');

function getStudentPages() { return getFacultyPages(); }

function setTab(el, id) {
  el.closest('.tabs').querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

function addTodo() {
  const input = document.getElementById('new-todo');
  const val = input.value.trim();
  if(!val) return;
  const container = input.parentElement.previousElementSibling;
  const item = document.createElement('div');
  item.className = 'todo-item';
  item.innerHTML = `<div class="todo-check" onclick="toggleTodo(this)"></div><div class="todo-text">${val}</div><span style="font-size:0.72rem;color:var(--muted);font-family:'DM Mono',monospace;">Custom</span>`;
  container.insertBefore(item, input.parentElement);
  input.value = '';
}
